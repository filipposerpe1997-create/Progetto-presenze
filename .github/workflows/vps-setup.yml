name: VPS setup

# Crea la cartella /var/www/html/presenze sulla VPS via SSH.
# Secret richiesti: VPS_HOST, VPS_USER, VPS_SSH_KEY (opzionale: VPS_PORT, default 22).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/vps-setup.yml

jobs:
  create-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Crea /var/www/html/presenze
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo -n"; fi
            $SUDO mkdir -p /var/www/html/presenze
            if id www-data >/dev/null 2>&1; then
              $SUDO chown -R www-data:www-data /var/www/html/presenze
            fi
            $SUDO chmod 755 /var/www/html/presenze
            ls -ld /var/www/html/presenze
